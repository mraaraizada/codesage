<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSage — Intelligent code understanding and debugging</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applied synchronously, before the app renders, so the console doesn't flash light-then-dark
      // on load. Kept in sync with ThemeToggle's own getInitialDark() logic.
      (function () {
        var forced = new URLSearchParams(window.location.search).get("theme");
        var stored = null;
        try {
          stored = localStorage.getItem("codesage-theme");
        } catch (e) {}
        var dark = forced === "dark" || (forced !== "light" && stored !== "light") ;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
