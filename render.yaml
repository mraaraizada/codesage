services:
  - type: web
    name: codesage-server
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm --prefix server install
    startCommand: npm --prefix server start
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    healthCheckPath: /api/health
